name: paiton-flux2
x-engine: &engine
  devices: [/dev/kfd, /dev/dri]
  group_add: ["${PAITON_RENDER_GID:?Use launch.sh to detect GPU access}"]
  shm_size: 2gb
  environment:
    HF_HUB_OFFLINE: "1"
  volumes:
    - ${PAITON_CACHE_BIND:-paiton-flux2-cache}:/models
  entrypoint: [python3, /opt/flux2-service/worker_api.py]
  init: true

services:
  paiton:
    <<: *engine
    image: ${PAITON_IMAGE:-ghcr.io/eliovp/paiton-flux2-klein:rdna4-v1.0.0}
    build: {context: ., dockerfile: Dockerfile}
    command: [--engine, paiton]
    ports: ["127.0.0.1:${PAITON_API_PORT:-7861}:7860"]
  stock:
    <<: *engine
    image: ${PAITON_TOOLS_IMAGE:-ghcr.io/eliovp/paiton-flux2-tools:rdna4-v1.0.0}
    build: {context: ., dockerfile: Dockerfile.tools}
    command: [--engine, stock]
    ports: ["127.0.0.1:${PAITON_STOCK_PORT:-7862}:7860"]
  comfyui:
    image: ${PAITON_COMFYUI_IMAGE:-ghcr.io/eliovp/paiton-flux2-comfyui:rdna4-v1.0.0}
    build: {context: ., dockerfile: Dockerfile.comfyui}
    environment:
      PAITON_FLUX2_ENDPOINT: http://paiton:7860
      PAITON_STOCK_ENDPOINT: http://stock:7860
    ports: ["127.0.0.1:${PAITON_UI_PORT:-8188}:8188"]
    volumes:
      - ${PAITON_OUTPUTS:-./outputs}:/outputs
      - paiton-flux2-comfy-user:/comfy-user
    depends_on: [paiton, stock]
    init: true

volumes:
  paiton-flux2-cache:
    name: ${PAITON_CACHE_VOLUME:-paiton-flux2-cache}
  paiton-flux2-comfy-user:
    name: paiton-flux2-comfy-user

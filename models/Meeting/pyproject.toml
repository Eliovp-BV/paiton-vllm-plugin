[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paiton-meeting"
version = "1.0.0rc1"
description = "Local meeting transcription, anonymous diarization and evidence-linked summaries"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
paiton-meeting = "paiton_meeting.__main__:main"

[tool.setuptools.packages.find]
include = ["paiton_meeting*"]
